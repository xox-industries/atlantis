name: atlantis

services:
  api:
    container_name: atlantis-api
    image: ${DOCKER_IMAGE_URL}/api:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: api
      dockerfile: Dockerfile.prod

    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5000/health'', timeout=5).read()"',
        ]
      timeout: 20s
      interval: 20s
      retries: 2
    networks:
      - atlantis
    ports:
      - 59111:5000
    restart: always
    environment:
      REDIS_URL: redis://redis:6379

  redis:
    container_name: atlantis-redis
    image: redis/redis-stack-server:latest
    networks:
      - atlantis
    restart: always

networks:
  atlantis:
