query ATL_CommandsStopMinecraftJavaEdition_DisplayMinecraftJavaEditionInstances {
  displayMinecraftJavaEditionInstances {
    path
    containerName
    ports
    running
  }
}

subscription ATL_CommandsStopMinecraftJavaEdition_StopMinecraftJavaEdition(
  $path: String!
) {
  stopMinecraftJavaEdition(path: $path)
}
