query ATL_CommandsStartPalworld_DisplayPalworldInstances {
  displayPalworldInstances {
    path
    containerName
    running
    ports
  }
}

mutation ATL_CommandsStartPalworld_StartPalworld($path: String!) {
  startPalworld(path: $path) {
    path
    containerName
    running
    ports
  }
}

subscription ATL_CommandsStartPalworld_PalworldValidateApp($path: String!) {
  palworldValidateApp(path: $path)
}
