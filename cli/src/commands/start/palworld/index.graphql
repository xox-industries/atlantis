query ATL_CommandsStartPalworld_DisplayPalworld {
  displayPalworld {
    name
    containerName
    running
    port
  }
}

mutation ATL_CommandsStartPalworld_StartPalworld($instance: String!) {
  startPalworld(instance: $instance) {
    name
    containerName
    running
    port
  }
}

subscription ATL_CommandsStartPalworld_PalworldValidateApp {
  palworldValidateApp
}
