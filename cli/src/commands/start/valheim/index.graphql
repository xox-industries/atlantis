query ATL_CommandsStartValheim_DisplayValheimInstances {
  displayValheimInstances {
    path
    containerName
    running
    ports
  }
}

mutation ATL_CommandsStartValheim_StartValheim($path: String!) {
  startValheim(path: $path) {
    path
    containerName
    running
    ports
  }
}

subscription ATL_CommandsStartValheim_ValheimValidateApp($path: String!) {
  valheimValidateApp(path: $path)
}
